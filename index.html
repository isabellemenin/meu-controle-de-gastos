<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meu Controle de Gastos</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <h1>Meu Controle de Gastos</h1>

        <!-- Saldo disponível -->
        <section class="saldo">
            <p>Saldo disponível</p>
            <h2 id="saldo">R$ 500,00</h2>
        </section>

        <!-- Formulário para adicionar dinheiro -->
        <h3>Adicionar dinheiro</h3>

        <section class="formulario">
            <input
                type="text"
                id="descricaoEntrada"
                placeholder="Descrição da entrada">

            <input
                type="number"
                id="valorEntrada"
                placeholder="Valor (R$)"
                min="0.01"
                step="0.01"
                inputmode="decimal">

            <button class="botao-entrada" onclick="adicionarDinheiro()">
                Adicionar dinheiro
            </button>
        </section>

        <!-- Formulário para adicionar gastos -->
        <h3>Adicionar gasto</h3>

        <section class="formulario">
            <input
                type="text"
                id="descricao"
                placeholder="Descrição do gasto">

            <input
                type="number"
                id="valor"
                placeholder="Valor (R$)"
                min="0.01"
                step="0.01"
                inputmode="decimal">

            <button onclick="adicionarGasto()">
                Adicionar gasto
            </button>
        </section>

        <!-- Histórico de movimentações -->
        <h3>Histórico de movimentações</h3>

        <div id="listaGastos"></div>

        <!-- Total dos gastos -->
        <section class="total">
            <p>Total gasto</p>
            <h2 id="total">R$ 0,00</h2>
        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
